name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bun run playwright install --with-deps chromium

      - name: Check formatting & lint
        run: bun run format:check

      - name: Check Astro types
        run: bun run check

      - name: Build
        run: bun run build

      - name: Apply D1 migrations (local)
        run: |
          for f in migrations/*.sql; do
            bun run wrangler d1 execute DB --local --file="$f"
          done

      - name: Run tests
        run: bun run test

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
